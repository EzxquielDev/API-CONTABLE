{% extends "layout.html" %}

{% block title %}Libro Diario{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/Inventario.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/facturacion.css') }}">

<section class="inventario-pagina">
  <header class="inventario-encabezado">
    <div>
      <h1><i class="ph ph-book-open" style="color: var(--primary); margin-right: 8px;"></i> Libro Diario</h1>
    </div>
  </header>

  <div class="panel filtros-inventario">
    <label for="ld-desde">Desde
      <input type="date" id="ld-desde">
    </label>
    <label for="ld-hasta">Hasta
      <input type="date" id="ld-hasta">
    </label>
    <button type="button" id="ld-btn-generar" onclick="consultarLibroDiario()" style="display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--text-primary); border: 1px solid var(--border-medium); box-shadow: none; font-weight: 500;"><i class="ph ph-magnifying-glass" style="margin-right: 6px; font-size: 1.1rem;"></i> Consultar</button>
    <button type="button" id="ld-btn-excel" onclick="descargarExcel()" disabled style="padding: 10px 18px; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--text-primary); border: 1px solid var(--border-medium); border-radius: var(--radius-sm); font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: all 0.2s; box-shadow: none;"><i class="ph ph-file-xls" style="margin-right: 6px; font-size: 1.1rem;"></i> Descargar Excel</button>
  </div>

  <p id="ld-mensaje" style="margin-bottom: 24px; color: var(--text-secondary);"></p>

  <section id="ld-cuerpo" style="display:none;">
    <div class="panel">
      <h3 style="margin-bottom: 16px; font-size: 1.1rem; color: var(--text-primary);" id="ld-periodo-leido"></h3>
      
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; min-width: 800px;">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Asiento</th>
              <th>Diario</th>
              <th>Cuenta</th>
              <th>Etiqueta</th>
              <th style="text-align: right;">Debe</th>
              <th style="text-align: right;">Haber</th>
            </tr>
          </thead>
          <tbody id="ld-tabla-cuerpo"></tbody>
        </table>
      </div>

      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
        <div style="display: flex; gap: 24px; font-weight: 600; color: var(--text-primary);">
          <div>Total debe: <span id="ld-total-debe" style="color: var(--primary);">—</span></div>
          <div>Total haber: <span id="ld-total-haber" style="color: var(--primary);">—</span></div>
          <div style="color: var(--text-secondary); font-weight: 500;">Líneas: <span id="ld-cantidad">—</span></div>
        </div>
        <div id="ld-cuadre" style="padding: 6px 12px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem;">—</div>
      </div>
    </div>
  </section>
</section>


<script>
(function () {
  const apiKey = "{{ api_key }}";
  const $ = (id) => document.getElementById(id);

  function formatoMoneda(numero) {
    return Number(numero).toLocaleString("es-SV", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function primerDiaMesActual() {
    const hoy = new Date();
    return new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().slice(0, 10);
  }

  function hoyISO() {
    return new Date().toISOString().slice(0, 10);
  }

  $("ld-desde").value = primerDiaMesActual();
  $("ld-hasta").value = hoyISO();

  let ultimosParametros = null;

  function mostrarMensaje(texto, esError) {
    const el = $("ld-mensaje");
    el.textContent = texto;
    el.classList.toggle("visible", Boolean(texto));
    el.classList.toggle("error", Boolean(esError));
  }

  function renderTabla(movimientos) {
    const cuerpo = $("ld-tabla-cuerpo");
    cuerpo.innerHTML = "";
    let asientoAnterior = null;
    let alterno = false;

    movimientos.forEach((m) => {
      if (m.asiento !== asientoAnterior) {
        alterno = !alterno;
        asientoAnterior = m.asiento;
      }
      const tr = document.createElement("tr");
      if (alterno) tr.style.background = "var(--border-light)";
      tr.innerHTML = `
        <td style="white-space: normal; word-break: break-word; vertical-align: top;">${m.fecha || ""}</td>
        <td style="white-space: normal; word-break: break-word; vertical-align: top; font-weight: 600;">${m.asiento || ""}</td>
        <td style="white-space: normal; word-break: break-word; vertical-align: top; color: var(--text-secondary);">${m.diario || ""}</td>
        <td style="white-space: normal; word-break: break-word; vertical-align: top; font-family: monospace;">${m.cuenta || ""}</td>
        <td style="white-space: normal; word-break: break-word; vertical-align: top; max-width: 250px;">${m.etiqueta || ""}</td>
        <td style="text-align: right; vertical-align: top; font-family: monospace; color: var(--text-primary);">${m.debe ? formatoMoneda(m.debe) : ""}</td>
        <td style="text-align: right; vertical-align: top; font-family: monospace; color: var(--text-primary);">${m.haber ? formatoMoneda(m.haber) : ""}</td>
      `;
      cuerpo.appendChild(tr);
    });
  }

  async function consultarLibroDiario() {
    const desde = $("ld-desde").value;
    const hasta = $("ld-hasta").value;

    if (!desde || !hasta) {
      mostrarMensaje("Selecciona ambas fechas.", true);
      return;
    }
    if (desde > hasta) {
      mostrarMensaje("La fecha 'desde' no puede ser mayor que 'hasta'.", true);
      return;
    }

    ultimosParametros = new URLSearchParams({ desde, hasta });
    $("ld-btn-generar").disabled = true;
    $("ld-btn-excel").disabled = true;
    mostrarMensaje("Consultando asientos en Odoo…", false);
    $("ld-cuerpo").classList.remove("visible");

    try {
      const resp = await fetch(`/api/libro-diario?${ultimosParametros.toString()}`, {
        headers: { "X-API-Key": apiKey }
      });
      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.error || "No se pudo obtener el libro diario.");
      }

      $("ld-periodo-leido").textContent = `Período consultado: ${data.desde} a ${data.hasta}`;
      renderTabla(data.movimientos);

      $("ld-total-debe").textContent = formatoMoneda(data.total_debe);
      $("ld-total-haber").textContent = formatoMoneda(data.total_haber);
      $("ld-cantidad").textContent = data.cantidad_lineas;

      const cuadreEl = $("ld-cuadre");
      const cuadra = Math.abs(data.diferencia) < 0.01;
      cuadreEl.textContent = cuadra ? "Cuadra: Debe = Haber" : `Diferencia: ${formatoMoneda(data.diferencia)}`;
      cuadreEl.style.background = cuadra ? "var(--success-light)" : "#F5E3E0";
      cuadreEl.style.color = cuadra ? "var(--success)" : "#A63B32";

      $("ld-cuerpo").style.display = "block";
      mostrarMensaje(data.movimientos.length ? "" : "No hay asientos contables en este período.", false);
      $("ld-btn-excel").disabled = false;
    } catch (err) {
      mostrarMensaje(err.message, true);
    } finally {
      $("ld-btn-generar").disabled = false;
    }
  }

  async function descargarExcel() {
    if (!ultimosParametros) return;
    $("ld-btn-excel").disabled = true;
    mostrarMensaje("Generando archivo Excel…", false);

    try {
      const resp = await fetch(`/api/libro-diario.xlsx?${ultimosParametros.toString()}`, {
        headers: { "X-API-Key": apiKey }
      });
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.error || "No se pudo generar el Excel.");
      }
      const blob = await resp.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `libro_diario_${$("ld-desde").value}_a_${$("ld-hasta").value}.xlsx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
      mostrarMensaje("", false);
    } catch (err) {
      mostrarMensaje(err.message, true);
    } finally {
      $("ld-btn-excel").disabled = false;
    }
  }

  // The event listeners were already removed because the buttons use inline onclick now.
  // We just run the initial query.
  consultarLibroDiario();
})();
</script>
{% endblock %}
